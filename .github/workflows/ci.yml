name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    name: Node ${{ matrix.node }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # The suite runs in jsdom, which does not implement contenteditable:
      # bold toggling, markdown shortcuts and the slash filter all pass here
      # and can still be broken in a browser. A green run is a floor, not a
      # release gate — smoke the widget in a real browser before publishing.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
